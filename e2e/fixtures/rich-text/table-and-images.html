<!-- 合成样本：表格 + 多图（无敏感内容，图片为不可达合成地址）。覆盖：完整表格结构、colspan/rowspan、figure。 -->
<section style="max-width: 100%;">
  <table style="border-collapse: collapse; width: 100%; margin: 12px 0;">
    <thead><tr style="background-color: #f2f6fc;"><th style="border: 1px solid #d8e2f0; padding: 8px; font-size: 13px;">项目</th><th style="border: 1px solid #d8e2f0; padding: 8px; font-size: 13px;">状态</th></tr></thead>
    <tbody>
      <tr><td style="border: 1px solid #d8e2f0; padding: 8px; font-size: 13px;" colspan="2">跨两列的说明行</td></tr>
      <tr><td style="border: 1px solid #d8e2f0; padding: 8px; font-size: 13px;">样本 A</td><td style="border: 1px solid #d8e2f0; padding: 8px; font-size: 13px;">可用</td></tr>
    </tbody>
  </table>
  <figure style="margin: 12px 0;">
    <img src="https://images.synthetic.example/alpha.png" alt="样本图 A" style="max-width: 100%;">
    <figcaption style="text-align: center; font-size: 12px; color: #999;">图注：合成样本图</figcaption>
  </figure>
</section>
