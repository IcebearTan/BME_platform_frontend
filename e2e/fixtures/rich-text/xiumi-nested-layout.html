<!-- 合成样本：秀米嵌套布局（无敏感内容）。覆盖：flex 两列、分栏卡片、边框圆角、引用块。 -->
<section style="max-width: 100%; box-sizing: border-box;">
  <section style="display: flex; flex-direction: row; gap: 12px; margin: 12px 0;">
    <section style="flex: 1; flex-basis: 0; background-color: #eef4fb; border-radius: 10px; padding: 14px;">
      <h3 style="margin: 0 0 8px; font-size: 15px; color: #2c5f9e;">左侧栏目</h3>
      <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #444444;">两列布局的左栏内容，用于验证 flex 分栏在清洗后的还原。</p>
    </section>
    <section style="flex: 1; flex-basis: 0; background-color: #fdf0ef; border-radius: 10px; padding: 14px;">
      <h3 style="margin: 0 0 8px; font-size: 15px; color: #a94442;">右侧栏目</h3>
      <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #444444;">两列布局的右栏内容，边框圆角与底色均为内联样式。</p>
    </section>
  </section>
  <blockquote style="margin: 12px 0; padding: 10px 16px; border-left: 4px solid #5b7bbd; background-color: #f5f7fa; color: #666666; font-size: 13px;">引用块：嵌套布局样本的第二部分。</blockquote>
</section>
