<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导生双选 · 高保真原型</title>
  <style>
    :root {
      --ink: #1d2c3c;
      --ink-2: #526270;
      --muted: #86949d;
      --line: rgba(43, 71, 82, .12);
      --paper: #f6f8f5;
      --paper-2: #ffffff;
      --ocean: #2b7188;
      --ocean-weak: #e1f2f1;
      --leaf: #42946f;
      --leaf-weak: #e7f4ed;
      --sun: #da8c38;
      --sun-weak: #fff1dc;
      --coral: #ce6655;
      --shadow: 0 18px 48px rgba(35, 58, 67, .10);
      --shadow-soft: 0 10px 26px rgba(35, 58, 67, .08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font); }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .site-header {
      position: sticky; top: 0; z-index: 20; height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 max(24px, calc((100vw - 1360px) / 2));
      border-bottom: 1px solid rgba(33, 58, 67, .08);
      background: rgba(255,255,255,.88); backdrop-filter: blur(18px);
    }
    .brand, .nav, .header-actions { display: flex; align-items: center; }
    .brand { gap: 10px; font-weight: 780; font-size: 20px; letter-spacing: .04em; color: #e48822; }
    .brand-mark { width: 38px; height: 38px; }
    .nav { gap: 8px; margin-left: 32px; }
    .nav button, .header-icon { border: 0; background: transparent; color: var(--ink-2); padding: 10px 13px; border-radius: 10px; }
    .nav button:hover, .nav button.is-current { color: var(--ocean); background: rgba(43,113,136,.08); }
    .header-actions { gap: 8px; }
    .header-icon { width: 38px; height: 38px; display: grid; place-items: center; position: relative; }
    .header-icon svg { width: 19px; height: 19px; }
    .notice-dot { position: absolute; top: 5px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; color: #fff; background: var(--coral); font-size: 10px; line-height: 16px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #e9f1f2; border: 1px solid #d9e5e7; color: var(--ocean); font-size: 13px; font-weight: 800; }

    .page { min-height: calc(100vh - 72px); overflow: hidden; background:
      radial-gradient(circle at 14% 8%, rgba(198,226,216,.72), transparent 27%),
      radial-gradient(circle at 86% 11%, rgba(252,220,194,.62), transparent 25%),
      linear-gradient(180deg, #f7faf7 0%, #f7f8f5 55%, #edf4ef 100%); }
    .shell { width: min(1360px, calc(100% - 48px)); margin: 0 auto; padding: 42px 0 188px; }

    .crumb { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); border: 0; background: transparent; padding: 0; font-size: 14px; }
    .crumb svg { width: 16px; height: 16px; }
    .crumb:hover { color: var(--ocean); }

    .hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 28px; padding: 24px 0 28px; }
    .hero-copy { padding: 24px 0 0; }
    .event-kicker { color: var(--ocean); letter-spacing: .12em; font-weight: 750; font-size: 12px; }
    h1 { margin: 11px 0 9px; font-size: clamp(36px, 4.5vw, 58px); letter-spacing: -.055em; line-height: 1.06; }
    .hero-copy p { max-width: 535px; margin: 0; color: var(--ink-2); font-size: 16px; line-height: 1.75; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 19px; }
    .meta-pill { padding: 7px 11px; border: 1px solid rgba(43,113,136,.13); border-radius: 999px; background: rgba(255,255,255,.56); color: var(--ink-2); font-size: 12px; }

    .hero-map { min-height: 212px; position: relative; isolation: isolate; overflow: hidden; border: 1px solid rgba(44,93,94,.12); border-radius: var(--radius-xl); background: rgba(255,255,255,.58); box-shadow: var(--shadow-soft); }
    .hero-map:before, .hero-map:after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(43,113,136,.24); }
    .hero-map:before { width: 220px; height: 220px; right: -35px; top: -80px; }
    .hero-map:after { width: 160px; height: 160px; right: 27px; top: -49px; border-color: rgba(66,148,111,.32); }
    .map-line { position: absolute; width: 190px; height: 1px; background: rgba(43,113,136,.4); transform: rotate(-24deg); right: 23px; top: 104px; }
    .map-node { position: absolute; z-index: 1; display: grid; place-items: center; width: 54px; height: 54px; border: 1px solid rgba(43,113,136,.15); border-radius: 50%; background: rgba(255,255,255,.72); box-shadow: 0 8px 20px rgba(43,113,136,.08); color: var(--ocean); font-size: 12px; font-weight: 750; }
    .map-node.n1 { right: 146px; top: 36px; } .map-node.n2 { right: 38px; top: 87px; color: var(--leaf); }
    .map-label { position: absolute; right: 45px; bottom: 26px; color: var(--ink-2); font-size: 13px; text-align: right; line-height: 1.55; }
    .map-label strong { display: block; color: var(--ink); }

    .stage-card { padding: 18px 22px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: rgba(255,255,255,.67); box-shadow: var(--shadow-soft); }
    .stage-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
    .stage-title { font-size: 15px; font-weight: 750; } .deadline { color: var(--coral); font-size: 13px; font-weight: 700; }
    .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; }
    .stage { min-width: 0; position: relative; display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .stage:not(:last-child):after { content: ""; position: absolute; left: 28px; right: -4px; top: 14px; height: 1px; background: #d7e1df; z-index: 0; }
    .stage-circle { z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid #d7e1df; background: #fff; }
    .stage.is-done .stage-circle { color: #fff; border-color: var(--leaf); background: var(--leaf); }
    .stage.is-active { color: var(--ocean); font-weight: 750; }
    .stage.is-active .stage-circle { color: #fff; border-color: var(--ocean); background: var(--ocean); box-shadow: 0 0 0 5px rgba(43,113,136,.12); }
    .stage-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 31px 0 18px; }
    .toolbar-title { display: flex; align-items: baseline; gap: 12px; }
    .toolbar h2 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .toolbar-title span { color: var(--muted); font-size: 13px; }
    .filter-row { display: flex; gap: 8px; }
    .filter { border: 1px solid transparent; border-radius: 999px; padding: 9px 13px; color: var(--ink-2); background: rgba(255,255,255,.6); transition: .2s ease; }
    .filter:hover { border-color: rgba(43,113,136,.2); transform: translateY(-1px); }
    .filter.is-active { color: var(--ocean); border-color: rgba(43,113,136,.25); background: #fff; box-shadow: 0 6px 15px rgba(43,113,136,.08); font-weight: 750; }

    .market-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .mentor-card { position: relative; display: flex; min-height: 490px; overflow: hidden; flex-direction: column; border: 1px solid rgba(40,67,73,.11); border-radius: 20px; background: rgba(255,255,255,.87); box-shadow: 0 8px 20px rgba(35,58,67,.055); transition: transform .28s var(--ease, cubic-bezier(.2,.7,.2,1)), box-shadow .28s ease, border-color .28s ease; }
    .mentor-card:hover { transform: translateY(-6px); border-color: rgba(43,113,136,.31); box-shadow: var(--shadow); }
    .mentor-card.is-picked { border-color: rgba(43,113,136,.55); box-shadow: 0 0 0 2px rgba(43,113,136,.08), var(--shadow-soft); }
    .poster { height: 255px; position: relative; overflow: hidden; color: #fff; }
    .poster:after { content:""; position:absolute; inset:0; background: linear-gradient(180deg, transparent 45%, rgba(20,41,46,.36)); pointer-events: none; }
    .poster-grid { position: absolute; inset: 0; opacity: .26; background-size: 22px 22px; background-image: linear-gradient(rgba(255,255,255,.8) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.8) 1px, transparent 1px); transform: perspective(350px) rotateX(52deg) translateY(45px) scale(1.25); transform-origin: center bottom; }
    .poster.software { background: #346b7c; } .poster.ai { background: #3a8f7a; } .poster.hardware { background: #b47242; } .poster.local { background: #59698c; }
    .poster-orbit { position: absolute; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,.5); border-radius: 50%; top: 40px; right: -30px; }
    .poster-orbit:after { content:""; position:absolute; width: 55px; height: 55px; top: 47px; left: 2px; border: 1px solid rgba(255,255,255,.6); border-radius: 50%; }
    .poster-mono { position: absolute; left: 23px; bottom: 19px; z-index: 1; font-size: 54px; line-height: .9; font-weight: 820; letter-spacing: -.09em; }
    .poster-caption { position:absolute; z-index:1; left: 25px; top: 24px; letter-spacing: .12em; font-size: 11px; font-weight: 750; opacity:.9; }
    .poster-stamp { position:absolute; z-index:2; right:12px; top:12px; padding:6px 9px; border-radius:999px; color:var(--ocean); background:rgba(255,255,255,.91); font-size:12px; font-weight:800; }
    .poster-rank { position:absolute; z-index:2; left:12px; top:12px; padding:6px 9px; border-radius:999px; color:#fff; background:rgba(29,44,60,.68); backdrop-filter:blur(8px); font-size:12px; font-weight:800; }
    .card-content { display: flex; flex: 1; flex-direction: column; padding: 19px 19px 17px; }
    .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .card-name { margin:0; font-size:21px; letter-spacing:-.025em; } .card-grade { margin-top:4px; color:var(--muted); font-size:12px; }
    .card-availability { flex: 0 0 auto; color:var(--leaf); font-size:12px; font-weight:750; }
    .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 12px; }
    .tag { padding: 5px 8px; border-radius: 7px; background: var(--ocean-weak); color: var(--ocean); font-size: 11px; font-weight: 700; }
    .tag.green { color: var(--leaf); background: var(--leaf-weak); } .tag.warm { color:#a15a20; background:var(--sun-weak); }
    .bio { margin:0; min-height:42px; color:var(--ink-2); font-size:13px; line-height:1.62; }
    .card-foot { margin-top:auto; padding-top:17px; }
    .seat-line { display:flex; justify-content:space-between; margin-bottom:8px; color:var(--muted); font-size:12px; }
    .seat-line strong { color:var(--ink); font-weight:750; }
    .seat-bar { height:5px; overflow:hidden; border-radius:99px; background:#e9efed; } .seat-bar i { display:block; height:100%; border-radius:inherit; background:var(--leaf); }
    .card-actions { display:flex; gap:8px; margin-top:16px; }
    .link-button, .pick-button, .submit-button { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; border-radius:11px; font-weight:750; transition:.2s ease; }
    .link-button { flex:1; padding:10px; color:var(--ink-2); background:#f3f6f5; } .link-button:hover { background:#eaf1ef; color:var(--ink); }
    .pick-button { flex:1.18; padding:10px; color:#fff; background:var(--ocean); } .pick-button:hover { background:#235f74; transform:translateY(-1px); }
    .pick-button.is-picked { color:var(--ocean); background:var(--ocean-weak); }
    .pick-button:disabled { cursor:default; opacity:.6; transform:none; }

    .tray-wrap { position: fixed; z-index: 10; bottom: 22px; left: 50%; width: min(1120px, calc(100% - 42px)); transform: translateX(-50%); }
    .tray { padding: 15px 17px 15px 20px; border: 1px solid rgba(43,113,136,.19); border-radius: 19px; background: rgba(255,255,255,.86); box-shadow: 0 20px 50px rgba(29,65,69,.18); backdrop-filter: blur(18px); }
    .tray-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
    .tray-title { display:flex; gap:9px; align-items:center; font-size:14px; font-weight:800; }
    .tray-count { padding:3px 7px; border-radius:99px; color:var(--ocean); background:var(--ocean-weak); font-size:11px; }
    .tray-deadline { color:var(--coral); font-size:12px; font-weight:750; }
    .choices { display:grid; grid-template-columns: repeat(3, 1fr) auto; gap:8px; align-items:center; }
    .choice { min-width:0; display:grid; grid-template-columns:28px 1fr auto; gap:9px; align-items:center; padding:7px 8px; border:1px solid #e4ebea; border-radius:12px; background:#fff; }
    .rank { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; color:#fff; background:var(--ocean); font-size:12px; font-weight:800; }
    .choice-main { min-width:0; } .choice-name { font-size:13px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .choice input { width:100%; margin-top:2px; border:0; outline:0; color:var(--muted); background:transparent; font-size:11px; }
    .choice button { border:0; color:var(--muted); background:transparent; padding:5px; font-size:12px; } .choice button:hover { color:var(--coral); }
    .submit-button { height:46px; padding:0 18px; color:#fff; background:var(--ink); white-space:nowrap; } .submit-button:hover { background:#0f222f; transform:translateY(-1px); }
    .submit-button:disabled { cursor:not-allowed; opacity:.4; transform:none; }

    .modal { position:fixed; z-index:40; inset:0; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(17,36,42,.38); backdrop-filter:blur(5px); }
    .modal.is-open { display:flex; } .modal-card { width:min(600px,100%); border-radius:22px; padding:28px; background:#fff; box-shadow:0 26px 80px rgba(12,29,36,.32); }
    .modal-top { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; } .modal-title { margin:0; font-size:26px; }
    .close { border:0; padding:7px; border-radius:8px; color:var(--ink-2); background:#f2f5f4; font-size:18px; line-height:1; }
    .modal p { color:var(--ink-2); line-height:1.75; } .modal-poster { height:128px; margin:18px 0; border-radius:14px; overflow:hidden; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
    .toast { position:fixed; z-index:50; top:88px; left:50%; display:flex; align-items:center; gap:9px; padding:12px 16px; border-radius:12px; color:#fff; background:var(--ink); box-shadow:var(--shadow); transform:translate(-50%,-18px); opacity:0; pointer-events:none; transition:.25s ease; }
    .toast.is-on { transform:translate(-50%,0); opacity:1; }
    .toast-mark { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:var(--leaf); font-size:12px; }

    @media (max-width: 1080px) { .market-grid { grid-template-columns:repeat(2, minmax(0,1fr)); } .hero { grid-template-columns:1fr; } .hero-map { min-height:170px; } }
    @media (max-width: 760px) { .site-header { height:60px; padding:0 16px; } .nav { display:none; } .shell { width:min(100% - 28px, 1360px); padding-top:24px; padding-bottom:260px; } .hero { padding-top:16px; } .stage-card { padding:16px; overflow:auto; } .stages { min-width:620px; } .toolbar { align-items:flex-start; flex-direction:column; margin-top:24px; } .filter-row { max-width:100%; overflow:auto; padding-bottom:4px; } .market-grid { grid-template-columns:1fr; } .mentor-card { min-height:440px; } .poster { height:210px; } .tray-wrap { width:calc(100% - 20px); bottom:10px; } .choices { grid-template-columns:1fr; } .choice { grid-template-columns:28px 1fr auto; } .submit-button { width:100%; } .tray-deadline { display:none; } }
    @media (prefers-reduced-motion: reduce) { *,*:before,*:after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 44 44" aria-label="AMEII"><path fill="#706CEB" d="M6 13.5 13 8l9 7 9-7 7 5.5v17L31 36l-9-7-9 7-7-5.5z" opacity=".18"/><path d="M7 25h8l4-10 5 16 4-10h9" fill="none" stroke="#706CEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="25" r="2.5" fill="#e58b2b"/><circle cx="37" cy="21" r="2.5" fill="#e58b2b"/></svg>
      <span>AMEII</span>

    </div>
    <div class="header-actions">
      <button class="header-icon" aria-label="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notice-dot">13</span></button>
      <div class="avatar" title="测试学员">测</div>

  <main class="page"><div class="shell">
    <button class="crumb" id="backButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>返回营期工作台</button>

    <section class="hero">
      <div class="hero-copy">
        <div class="event-kicker">本地导师双选测试营</div>

      </div>

        <div class="map-label">医学融合<strong>共同成长</strong></div>

        <div class="stage is-done"><span class="stage-circle">1</span><span class="stage-label">浏览名片</span></div>
        <div class="stage is-active"><span class="stage-circle">2</span><span class="stage-label">提交志愿</span></div>

    <div class="choices" id="choices"></div>
  </section></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-top"><div><p class="event-kicker" id="modalKicker">方向</p><h2 class="modal-title" id="modalTitle">导生详情</h2></div><button class="close" id="closeModal" aria-label="关闭">×</button></div><div class="modal-poster" id="modalPoster"></div><p id="modalBio"></p><div class="modal-actions"><button class="link-button" id="modalCancel">返回</button><button class="pick-button" id="modalPick">加入志愿</button></div></div></div>
  <div class="toast" id="toast"><span class="toast-mark">✓</span><span id="toastText">志愿已更新</span></div>

  <script>
    const mentors = [
      { id: 'local', name: '本地导生', grade: '2024级 · 软件开发', field: 'software', tags: ['软件开发'], seats: 6, taken: 0, bio: '期待和你一起把想法做成真正能用的产品。', visual: 'local', mono: '做', note: '' },
      { id: 'lin', name: '林泽宇', grade: '2024级 · 软件开发', field: 'software', tags: ['软件开发', 'Web实践'], seats: 4, taken: 0, bio: '专注 Web 开发与智能平台建设，欢迎一起做项目、拆问题。', visual: 'software', mono: '建', note: '' },
      { id: 'chen', name: '陈思涵', grade: '2024级 · 人工智能', field: 'ai', tags: ['人工智能', '医学数据'], seats: 4, taken: 0, bio: '关注人工智能与医学交叉应用，探索医疗数据智能分析。', visual: 'ai', mono: '智', note: '' },
      { id: 'zhou', name: '周启航', grade: '2024级 · 硬件创新', field: 'hardware', tags: ['硬件创新', '嵌入式'], seats: 4, taken: 0, bio: '研究嵌入式系统与智能硬件设计，参与医工融合项目开发。', visual: 'hardware', mono: '造', note: '' }
    ];
    let picks = ['lin', 'zhou', 'local'];
    let activeFilter = 'all'; let openedMentor = null;
    const $ = (s) => document.querySelector(s);
    const getMentor = (id) => mentors.find(m => m.id === id);
    const showToast = (text) => { $('#toastText').textContent = text; $('#toast').classList.add('is-on'); setTimeout(() => $('#toast').classList.remove('is-on'), 2100); };

    function posterMarkup(m) { return `<div class="poster ${m.visual}"><div class="poster-grid"></div><div class="poster-orbit"></div><span class="poster-caption">AMEII / ${m.tags[0]}</span><span class="poster-stamp">余 ${m.seats - m.taken}</span>${picks.includes(m.id) ? `<span class="poster-rank">志愿 ${picks.indexOf(m.id)+1}</span>` : ''}<span class="poster-mono">${m.mono}</span></div>`; }
    function renderCards() {
      const visible = mentors.filter(m => activeFilter === 'all' || m.field === activeFilter);
      $('#marketGrid').innerHTML = visible.map(m => {
        const rank = picks.indexOf(m.id); const isPicked = rank !== -1;
        return `<article class="mentor-card ${isPicked ? 'is-picked' : ''}" data-id="${m.id}">${posterMarkup(m)}<div class="card-content"><div class="card-head"><div><h3 class="card-name">${m.name}</h3><div class="card-grade">${m.grade}</div></div><span class="card-availability">招募中</span></div><div class="tag-list">${m.tags.map((t,i) => `<span class="tag ${i === 1 ? 'green' : ''}">${t}</span>`).join('')}</div><p class="bio">${m.bio}</p><div class="card-foot"><div class="seat-line"><span>小组名额</span><strong>${m.taken} / ${m.seats}</strong></div><div class="seat-bar"><i style="width:${m.taken/m.seats*100}%"></i></div><div class="card-actions"><button class="link-button" data-detail="${m.id}">查看名片</button><button class="pick-button ${isPicked ? 'is-picked' : ''}" data-pick="${m.id}">${isPicked ? `已列为志愿 ${rank+1}` : '加入志愿'}</button></div></div></div></article>`;
      }).join('');
      document.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => openDetail(b.dataset.detail));
      document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => togglePick(b.dataset.pick));
    }
    function renderChoices() {
      $('#choiceCount').textContent = `${picks.length} / 3`;
      $('#choices').innerHTML = [0,1,2].map(i => {
        const m = getMentor(picks[i]);
        if (!m) return `<div class="choice"><span class="rank">${i+1}</span><div class="choice-main"><div class="choice-name">还没有选择</div><input disabled placeholder="从上方名片加入志愿"></div></div>`;
        return `<div class="choice"><span class="rank">${i+1}</span><div class="choice-main"><div class="choice-name">${m.name}</div><input data-note="${m.id}" value="${m.note}" placeholder="给导生留一句话（可选）"></div><button data-remove="${m.id}" aria-label="移除 ${m.name}">移除</button></div>`;
      }).join('') + `<button class="submit-button" id="submitButton" ${picks.length !== 3 ? 'disabled' : ''}>${picks.length === 3 ? '提交志愿' : '还需选择导生'}</button>`;
      document.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { picks = picks.filter(id => id !== b.dataset.remove); update(); showToast('已从志愿中移除'); });
      document.querySelectorAll('[data-note]').forEach(input => input.oninput = e => getMentor(e.target.dataset.note).note = e.target.value);
      $('#submitButton').onclick = () => { showToast('志愿已保存，截止前仍可修改'); $('#submitSignal').textContent = '你的志愿已保存'; };
    }
    function update(){ renderCards(); renderChoices(); }
    function togglePick(id) { const index = picks.indexOf(id); if(index !== -1){ picks.splice(index,1); showToast('已从志愿中移除'); } else if(picks.length === 3) { showToast('已填满 3 个志愿，请先移除一个'); } else { picks.push(id); showToast(`已加入第 ${picks.length} 志愿`); } update(); }
    function openDetail(id) { openedMentor = getMentor(id); $('#modalKicker').textContent = openedMentor.grade; $('#modalTitle').textContent = openedMentor.name; $('#modalBio').textContent = openedMentor.bio; $('#modalPoster').innerHTML = posterMarkup(openedMentor); $('#modal').classList.add('is-open'); $('#modalPick').textContent = picks.includes(id) ? '从志愿中移除' : '加入志愿'; }
    function closeModal(){ $('#modal').classList.remove('is-open'); openedMentor = null; }
    $('#closeModal').onclick = closeModal; $('#modalCancel').onclick = closeModal; $('#modal').onclick = e => { if(e.target === $('#modal')) closeModal(); }; $('#modalPick').onclick = () => { togglePick(openedMentor.id); closeModal(); };
    $('#backButton').onclick = () => showToast('原型演示：将返回营期工作台');
    document.querySelectorAll('.filter').forEach(button => button.onclick = () => { activeFilter = button.dataset.filter; document.querySelectorAll('.filter').forEach(b => b.classList.toggle('is-active', b === button)); renderCards(); });
    update();
  </script>
</body>
</html>
